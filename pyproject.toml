[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "tracking-cellmot"
version = "0.1.0"
description = "Biohub cell tracking: training code for the models of the Inference kernel"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
    "torch>=2.9.1",
    "tracksdata @ git+https://github.com/royerlab/tracksdata@main",
    "zarr>=3.0.10",
    "scipy",
    "scikit-learn",
    "polars",
    "dask",
    "joblib",
    "tqdm",
    "kaggle>=2.2.3",
    "ipykernel>=6.31.0",
    "ipywidgets>=8.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.3",
    "timm>=1.0.28",
]

[tool.ruff]
target-version = "py311"
src = ["src"]
line-length = 120

[tool.ruff.lint]
pydocstyle = { convention = "numpy" }
ignore = ["E712"]
select = [
    "E",    # style errors
    "W",    # style warnings
    "F",    # flakes
    "D417", # Missing argument descriptions in Docstrings
    "I",    # isort
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "B",    # flake8-bugbear
    "A001", # flake8-builtins
    "RUF",  # ruff-specific rules
    "TID",  # flake8-tidy-imports
]

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = false
